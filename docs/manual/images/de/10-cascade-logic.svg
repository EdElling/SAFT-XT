<text x='60' y='322' font-size='13' fill='#64748b' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>18:7  = über Verknüpfungsfeld 18 (Bestellungen.kunde_id) ausgewählte Bestellung 7 (Ebene 1)</text>
<text x='60' y='346' font-size='13' fill='#0f172a' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Jeder Schritt wird geprüft: Verknüpfung konfiguriert · Leserecht · Datensatz gehört wirklich dazu.</text>
<text x='60' y='370' font-size='13' fill='#0f172a' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Ungültige Teile werden abgeschnitten; Neu laden und Zurück zeigen denselben Zustand.</text>
