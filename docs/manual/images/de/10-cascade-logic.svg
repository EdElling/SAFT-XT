<text x='60' y='266' font-size='14' fill='#4f46e5' font-weight='600' text-anchor='start' xml:space='preserve' style='white-space:pre' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>URL:  /admin/data/kunden?sel=2,18:7</text>
